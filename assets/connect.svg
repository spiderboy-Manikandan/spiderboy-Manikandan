<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Connect card: open to internships and freelance, usually replies within a day, based in Madurai, Tamil Nadu">
<defs><linearGradient id="bd" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#6C5CE7"/><stop offset=".5" stop-color="#C86DD7"/><stop offset="1" stop-color="#FF6B9D"/></linearGradient>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#141a2b"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs>
<style>
@keyframes mq{to{stroke-dashoffset:-100}}.mq{stroke-dasharray:18 82;animation:mq 7s linear infinite}
@keyframes dot{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}.dot{transform-box:fill-box;transform-origin:center;animation:dot 1.8s ease-out infinite}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}.cu{animation:bl 1s steps(1) infinite}
@keyframes fl{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(8px,-10px) rotate(6deg)}}.pl{animation:fl 3.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
