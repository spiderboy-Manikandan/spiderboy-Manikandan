<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#302b63;#0f0c29" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#302b63">
        <animate attributeName="stop-color" values="#302b63;#6C5CE7;#302b63" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#C86DD7">
        <animate attributeName="stop-color" values="#C86DD7;#FF6B9D;#C86DD7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="1000" height="260" fill="url(#bgGrad)"/>

  <!-- Floating orbit dots -->
  <g opacity="0.55">
    <circle cx="80" cy="60" r="3" fill="#FF6B9D">
      <animate attributeName="cy" values="60;200;60" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="220" r="2.5" fill="#C86DD7">
      <animate attributeName="cy" values="220;40;220" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="50" r="3" fill="#6C5CE7">
      <animate attributeName="cy" values="50;190;50" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="210" r="2" fill="#FF6B9D">
      <animate attributeName="cy" values="210;30;210" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="30" r="2.5" fill="#ffffff">
      <animate attributeName="cy" values="30;230;30" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="150" r="2" fill="#ffffff" opacity="0.6">
      <animate attributeName="cx" values="60;120;60" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="140" r="2" fill="#ffffff" opacity="0.6">
      <animate attributeName="cx" values="940;880;940" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Code brackets motif -->
  <text x="500" y="115" font-family="Fira Code, monospace" font-size="46" font-weight="700"
        fill="#ffffff" text-anchor="middle">
    &lt;/ Manikandan B &gt;
    <animate attributeName="opacity" values="0;1;1" dur="1.6s" begin="0.2s" fill="freeze"/>
  </text>
  <text x="500" y="155" font-family="Fira Code, monospace" font-size="18"
        fill="#F5F0FF" text-anchor="middle" opacity="0.9">
    Full-Stack Developer • IoT Builder • Diploma CSE (9.4/10 CGPA)
  </text>

  <!-- Underline draw-in -->
  <line x1="300" y1="180" x2="700" y2="180" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
    <animate attributeName="x1" values="500;300" dur="1s" begin="0.4s" fill="freeze"/>
    <animate attributeName="x2" values="500;700" dur="1s" begin="0.4s" fill="freeze"/>
  </line>
</svg>
