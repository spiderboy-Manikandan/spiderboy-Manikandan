<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 96" width="820" height="96" role="img" aria-label="How I Build Projects">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#6C5CE7"/><stop offset=".5" stop-color="#C86DD7"/><stop offset="1" stop-color="#FF6B9D"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
