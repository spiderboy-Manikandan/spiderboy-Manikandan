name: 🐍 Contribution Snake

on:
  schedule:
    - cron: "15 0 * * *"      # every day at 00:15 UTC
  workflow_dispatch:           # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🐍 Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: spiderboy-Manikandan
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FF4FD8

      - name: 🚀 Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
